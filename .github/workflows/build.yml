name: Build-X60Pro-107m
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: openwrt-24.10-6.6

      - name: InstallDeps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache clang cpio curl device-tree-compiler \
            flex g++ g++-multilib gawk gcc gcc-multilib git git-lfs gnupg gettext \
            libelf-dev libncurses-dev libssl-dev python3 python3-distutils \
            python3-pyelftools python3-setuptools rsync swig texinfo unzip wget \
            xsltproc zlib1g-dev zstd file

      - name: Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Config
        run: |
          printf '%s\n' \
          'CONFIG_TARGET_mediatek=y' \
          'CONFIG_TARGET_mediatek_filogic=y' \
          'CONFIG_TARGET_MULTI_PROFILE=y' \
          'CONFIG_TARGET_PER_DEVICE_ROOTFS=y' \
          'CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_ruijie_rg-x60-pro-107m=y' \
          'CONFIG_PACKAGE_luci-i18n-base-zh-cn=y' \
          'CONFIG_PACKAGE_luci-app-upnp=y' \
          'CONFIG_PACKAGE_luci-i18n-upnp-zh-cn=y' \
          'CONFIG_PACKAGE_luci-app-ddns=y' \
          'CONFIG_PACKAGE_luci-i18n-ddns-zh-cn=y' \
          'CONFIG_PACKAGE_luci-app-sqm=y' \
          'CONFIG_PACKAGE_luci-i18n-sqm-zh-cn=y' > .config
          make defconfig
          echo "=====CHECK====="
          grep -E "ruijie|upnp|ddns|sqm|base-zh" .config | grep "=y" || true

      - name: Download
        run: make download -j$(nproc)

      - name: Build
        run: |
          set -o pipefail
          make -j$(nproc) 2>&1 | tee build-full.log || {
            echo "========== ERROR SUMMARY BEGIN =========="
            grep -nE "Error|error:|No such file|cannot find|undefined reference|recipe for target" build-full.log | tail -n 80 || true
            echo "========== ERROR SUMMARY END =========="
            exit 1
          }

      - name: List
        if: success()
        run: find bin/targets -iname "*x60-pro-107m*" | sort

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: x60pro-107m
          path: bin/targets/mediatek/
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-full-log
          path: build-full.log
          if-no-files-found: ignore
