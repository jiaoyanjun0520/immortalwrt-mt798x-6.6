name: Build-X60Pro-107m
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: openwrt-24.10-6.6
      - name: InstallDeps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3-distutils python3-setuptools rsync unzip zlib1g-dev file wget xsltproc swig
      - name: Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
      - name: Config
        run: |
          printf '%s\n' \
          'CONFIG_TARGET_mediatek=y' \
          'CONFIG_TARGET_mediatek_filogic=y' \
          'CONFIG_TARGET_MULTI_PROFILE=y' \
          'CONFIG_TARGET_PER_DEVICE_ROOTFS=y' \
          'CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_ruijie_rg-x60-pro-107m=y' \
          'CONFIG_PACKAGE_luci-i18n-base-zh-cn=y' \
          'CONFIG_PACKAGE_luci-app-turboacc=y' \
          'CONFIG_PACKAGE_luci-app-upnp=y' \
          'CONFIG_PACKAGE_luci-i18n-upnp-zh-cn=y' \
          'CONFIG_PACKAGE_luci-app-ddns=y' \
          'CONFIG_PACKAGE_luci-i18n-ddns-zh-cn=y' \
          'CONFIG_PACKAGE_luci-app-sqm=y' \
          'CONFIG_PACKAGE_luci-i18n-sqm-zh-cn=y' > .config
          make defconfig
          echo "=====CHECK====="
          grep -E "ruijie|turboacc|upnp|ddns|sqm|base-zh" .config | grep "=y" || true
      - name: Download
        run: make download -j$(nproc)
      - name: Build
        run: make -j$(nproc)
      - name: List
        run: find bin/targets -iname "*x60-pro-107m*" | sort
      - uses: actions/upload-artifact@v4
        with:
          name: x60pro-107m
          path: bin/targets/mediatek/
          if-no-files-found: error
